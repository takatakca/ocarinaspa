name: Validate Ocarina TAKATAK migration notice PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/index.tsx'
      - 'src/components/TakatakMigrationNotice.tsx'
      - 'public/serveur-demenage.html'
      - 'docs/TAKATAK_LEGACY_NOTICE.md'
      - '.github/workflows/validate-takatak-notice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.OCARINASPA_SUPABASE_URL || 'https://jbdkvdowxwrwyuhglxgu.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OCARINASPA_SUPABASE_PUBLISHABLE_KEY || 'build-only-placeholder' }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.OCARINASPA_SUPABASE_PROJECT_ID || 'jbdkvdowxwrwyuhglxgu' }}
      SUPABASE_URL: ${{ vars.OCARINASPA_SUPABASE_URL || 'https://jbdkvdowxwrwyuhglxgu.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.OCARINASPA_SUPABASE_PUBLISHABLE_KEY || 'build-only-placeholder' }}
      VITE_TAKATAK_MIGRATION_NOTICE_HOME: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Check live-site release gates statically
        run: npm run prelive:check
      - name: Build with current homepage (notice disabled)
        run: npm run build:node
      - name: Verify built server with notice disabled
        run: node scripts/verify-built-release.mjs
      - name: Build with opt-in notice enabled
        run: VITE_TAKATAK_MIGRATION_NOTICE_HOME=true npm run build:node
      - name: Verify built server with notice enabled
        run: VITE_TAKATAK_MIGRATION_NOTICE_HOME=true node scripts/verify-built-release.mjs
